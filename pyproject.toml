[project]
name = "tiktok-genfarmer-automation"
version = "0.1.0"
description = "Authorized Android automation using GenFarmer and XProxy"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "websocket-client>=1.8,<2",
  "asar>=0.1.3,<0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
